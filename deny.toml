[graph]
all-features = true

[output]
feature-depth = 1

[advisories]
version = 2
yanked = "warn"
# Transitive dependencies count: an unmaintained crate deep in the graph is still shipped.
unmaintained = "all"
ignore = [
  # Unmaintained, not vulnerable, and no release is patched. It is reached only through
  # feed-rs 3.0.0, whose move to jiff is feed-rs/feed-rs#310; drop this entry with that
  # release, when cargo-deny reports it as no longer encountered.
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; reached only through feed-rs" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
