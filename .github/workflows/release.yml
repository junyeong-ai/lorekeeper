name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # `ci.yml` triggers on pushes to `main` and never on a tag ref, so the two runs used to be
  # independent and start together: v0.13.6 was published six minutes after its own CI failure was
  # already recorded, because nothing connected them. Polling CI's conclusion for this SHA would
  # race it — the release run routinely starts first — so the release RUNS the gates.
  #
  # By calling `ci.yml` rather than restating its steps, every gate it has gates the release,
  # including ones added later. Restating them is how the first attempt at this silently omitted
  # the Windows compile check and shellcheck, which is the same defect one step removed.
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  # Release-specific, so it stays here: every version in the archives comes from the tag name and
  # no step read a manifest. A tag pushed on an unbumped tree ships `lore-v0.13.8-*` holding a
  # binary that prints 0.13.7, and `install.sh` compares the two and offers to reinstall on every
  # run forever. The skill `version:` frontmatter is already pinned to this same crate version by
  # `every_skill_version_matches_the_crate_version`, so agreeing with it here makes the tag, the
  # binary and the skills one version by construction.
  version:
    name: tag names the declared version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Compare
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          declared=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "lore") | .version')
          if [ "$TAG" != "v$declared" ]; then
            echo "tag $TAG does not name the declared version v$declared — bump the crates" >&2
            exit 1
          fi

  build:
    name: build ${{ matrix.target }}
    needs: [verify, version]
    runs-on: ${{ matrix.os }}
    # The sha256 sidecar travels the same channel as the archive it describes, so it proves the
    # bytes arrived intact and nothing about who produced them — a compromised release channel
    # rewrites both. An attestation signs the archive against THIS workflow's run, which is the
    # link `lore self update --verify-attestations` checks and the sidecar cannot make. The two
    # write scopes it needs are declared here rather than at the top of the file, where they
    # would also be handed to every job that only reads.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
            archive: zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # No build cache: these are the bytes a user installs, so they are compiled from the
      # checkout rather than restored from a store some other run wrote.
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }} -p lore

      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --release --locked --target ${{ matrix.target }} -p lore

      - name: Resolve version
        id: version
        shell: bash
        env:
          REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="${REF#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Package archive
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCHIVE_EXT: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          stage="lore-v${VERSION}-${TARGET}"
          mkdir -p "$stage"
          if [ "$ARCHIVE_EXT" = "zip" ]; then
            cp "target/${TARGET}/release/lore.exe" "$stage/"
          else
            cp "target/${TARGET}/release/lore" "$stage/"
          fi
          # The binary carries the templates, the skills, the pipeline scripts and the config
          # example, and `lore self deploy` writes them — so an archive holding copies would
          # publish a second set that nothing installs and that could disagree with the first.
          cp README.md LICENSE "$stage/"
          archive="${stage}.${ARCHIVE_EXT}"
          if [ "$ARCHIVE_EXT" = "zip" ]; then
            powershell -Command "Compress-Archive -Path '$stage' -DestinationPath '$archive' -Force"
          else
            tar -czf "$archive" "$stage"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.archive }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -la artifacts
          # Each release is tagged with a message explaining what changed and why.
          # Publishing only `--generate-notes` left that unread on GitHub and every body a
          # bare commit list, so the tag's message becomes the body and the generated list
          # is appended under it. `--notes-from-tag` would say this in one flag but refuses
          # to combine with `--generate-notes`, which would cost the compare link.
          # Checkout leaves a shallow clone with no tag object, so fetch just this one —
          # by name rather than as a refspec, which keeps a `$TAG:` adjacency out of the
          # string (harmless in bash, a modifier that silently truncates it in zsh).
          # `subject` + `body` rather than `contents`, which would also emit the signature
          # block once these tags are signed; both fall back to the tagged commit's message
          # for a lightweight tag, so the body is the text a human wrote either way.
          git fetch --force --depth=1 origin tag "$TAG"
          # `git tag -l` takes a GLOB and exits 0 on no match, so a typo'd or wildcarded
          # tag would silently publish generated notes only — or concatenate several tags'
          # messages. Refuse instead: a release whose notes went missing is worth a red job.
          case "$TAG" in
            *[\*\?\[]*) echo "tag name must not contain glob characters: $TAG" >&2; exit 1 ;;
          esac
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" \
            > release-notes.md
          [ -s release-notes.md ] || { echo "no tag message for $TAG" >&2; exit 1; }
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --generate-notes \
            artifacts/*
