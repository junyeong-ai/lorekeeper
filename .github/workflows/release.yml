name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
            archive: zip

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }} -p lore

      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --release --locked --target ${{ matrix.target }} -p lore

      - name: Resolve version
        id: version
        shell: bash
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          version="${ref#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Package archive
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCHIVE_EXT: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          stage="lore-v${VERSION}-${TARGET}"
          mkdir -p "$stage/templates"
          if [ "$ARCHIVE_EXT" = "zip" ]; then
            cp "target/${TARGET}/release/lore.exe" "$stage/"
          else
            cp "target/${TARGET}/release/lore" "$stage/"
          fi
          cp templates/*.md.jinja "$stage/templates/"
          cp config.example.yaml "$stage/"
          cp README.md LICENSE 2>/dev/null "$stage/" || cp README.md "$stage/"
          archive="${stage}.${ARCHIVE_EXT}"
          if [ "$ARCHIVE_EXT" = "zip" ]; then
            powershell -Command "Compress-Archive -Path '$stage' -DestinationPath '$archive' -Force"
          else
            tar -czf "$archive" "$stage"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.archive }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  skill:
    name: package skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Resolve version
        id: version
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
      - name: Package skill tarballs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # One archive per skill, named `{skill}-skill-v{version}.tar.gz` to match
          # what scripts/install.sh and install.ps1 download. Each contains the
          # skill directory.
          for skill in lore-ingest lore-process lore-setup lore-wiki lore-capture lore-extract; do
            archive="${skill}-skill-v${VERSION}.tar.gz"
            tar -czf "$archive" -C .claude/skills "$skill"
            sha256sum "$archive" > "${archive}.sha256"
          done
          # Scheduled-task agent definitions ship as plain `.md` release assets;
          # install.sh / install.ps1 fetch them by name (`v{version}/{name}.md`).
          cp scripts/lore-daily-ingest.md scripts/lore-weekly-ingest.md .
      - uses: actions/upload-artifact@v7
        with:
          name: skills
          path: |
            *-skill-v*.tar.gz
            *-skill-v*.tar.gz.sha256
            lore-daily-ingest.md
            lore-weekly-ingest.md
          if-no-files-found: error

  release:
    name: publish release
    needs: [build, skill]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -la artifacts
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            artifacts/*
