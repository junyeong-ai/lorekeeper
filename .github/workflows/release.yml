name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
            archive: zip

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }} -p lore

      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --release --locked --target ${{ matrix.target }} -p lore

      - name: Resolve version
        id: version
        shell: bash
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          version="${ref#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Package archive
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCHIVE_EXT: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          stage="lore-v${VERSION}-${TARGET}"
          mkdir -p "$stage/templates"
          if [ "$ARCHIVE_EXT" = "zip" ]; then
            cp "target/${TARGET}/release/lore.exe" "$stage/"
          else
            cp "target/${TARGET}/release/lore" "$stage/"
          fi
          cp templates/*.md.jinja "$stage/templates/"
          cp config.example.yaml "$stage/"
          cp README.md LICENSE 2>/dev/null "$stage/" || cp README.md "$stage/"
          archive="${stage}.${ARCHIVE_EXT}"
          if [ "$ARCHIVE_EXT" = "zip" ]; then
            powershell -Command "Compress-Archive -Path '$stage' -DestinationPath '$archive' -Force"
          else
            tar -czf "$archive" "$stage"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.archive }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  skill:
    name: package skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Resolve version
        id: version
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
      - name: Package skill tarballs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # One archive per skill, named `{skill}-skill-v{version}.tar.gz` to match
          # what scripts/install.sh and install.ps1 download. Each contains the
          # skill directory.
          for skill in lore-ingest lore-process lore-setup lore-wiki lore-capture lore-extract; do
            archive="${skill}-skill-v${VERSION}.tar.gz"
            tar -czf "$archive" -C .claude/skills "$skill"
            sha256sum "$archive" > "${archive}.sha256"
          done
          # The scheduled pipelines ship as plain shell assets; install.sh fetches them
          # by name (`v{version}/{name}`) when there is no repo checkout to copy from.
          cp scripts/lore-pipeline.sh scripts/lore-daily.sh scripts/lore-weekly.sh .
      - uses: actions/upload-artifact@v7
        with:
          name: skills
          path: |
            *-skill-v*.tar.gz
            *-skill-v*.tar.gz.sha256
            lore-pipeline.sh
            lore-daily.sh
            lore-weekly.sh
          if-no-files-found: error

  release:
    name: publish release
    needs: [build, skill]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -la artifacts
          # Each release is tagged with a message explaining what changed and why.
          # Publishing only `--generate-notes` left that unread on GitHub and every body a
          # bare commit list, so the tag's message becomes the body and the generated list
          # is appended under it. `--notes-from-tag` would say this in one flag but refuses
          # to combine with `--generate-notes`, which would cost the compare link.
          # Checkout leaves a shallow clone with no tag object, so fetch just this one —
          # by name rather than as a refspec, which keeps a `$TAG:` adjacency out of the
          # string (harmless in bash, a modifier that silently truncates it in zsh).
          # `subject` + `body` rather than `contents`, which would also emit the signature
          # block once these tags are signed; both fall back to the tagged commit's message
          # for a lightweight tag, so the body is the text a human wrote either way.
          git fetch --force --depth=1 origin tag "$TAG"
          # `git tag -l` takes a GLOB and exits 0 on no match, so a typo'd or wildcarded
          # tag would silently publish generated notes only — or concatenate several tags'
          # messages. Refuse instead: a release whose notes went missing is worth a red job.
          case "$TAG" in
            *[\*\?\[]*) echo "tag name must not contain glob characters: $TAG" >&2; exit 1 ;;
          esac
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" \
            > release-notes.md
          [ -s release-notes.md ] || { echo "no tag message for $TAG" >&2; exit 1; }
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --generate-notes \
            artifacts/*
