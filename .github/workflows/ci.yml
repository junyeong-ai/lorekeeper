name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly security audit on Monday 05:00 UTC
    - cron: "0 5 * * 1"
  # `release.yml` calls this so a tag cannot publish past a gate. Called rather than duplicated:
  # the release used to restate fmt/clippy/test and therefore missed the Windows check and
  # shellcheck the moment they were added here, which is the same defect as having no coupling at
  # all, one step removed. Every gate added below now gates the release too, by construction.
  workflow_call:
    inputs:
      ref:
        # `lore schedule`-style manual releases pass a tag that is NOT `github.ref` — the dispatch
        # runs on a branch — so without this the gates would verify the branch and the archives
        # would be built from the tag. Empty for every other trigger, where `actions/checkout`
        # then defaults to the ref that triggered the run.
        description: "Commit-ish to verify; defaults to the triggering ref."
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1
  RUSTUP_MAX_RETRIES: 10

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Read repository toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(awk -F'"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "rust-toolchain.toml declares no channel" >&2; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master commit (2026-10-16)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt
      # Tool versions are fixed; security audits still refresh their advisory database.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: taplo@0.10.0
      - run: cargo fmt --all --check
      # The manifests are the other language this workspace is written in: a version, a
      # feature and a lint level all live there.
      - run: taplo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Read repository toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(awk -F'"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "rust-toolchain.toml declares no channel" >&2; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master commit (2026-10-16)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: clippy
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Read repository toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(awk -F'"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "rust-toolchain.toml declares no channel" >&2; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master commit (2026-10-16)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      # Pinned for the reason scripts/check.sh states: an inherited `always` turns every
      # snapshot into a rubber stamp.
      - run: INSTA_UPDATE=no cargo nextest run --locked --workspace --all-targets
      - run: cargo test --locked --workspace --doc

  # The release builds `x86_64-pc-windows-msvc` and `install.ps1` installs it, but nothing here
  # compiled it: `google/oauth.rs` and `atlassian/oauth.rs` carry `#[cfg(target_os = "windows")]`
  # bodies that no job has ever type-checked. `--all-targets` covers the test code too, which is
  # where the platform-specific `std::os` calls live. Compile-only for now: whether the suite
  # PASSES on Windows is a separate question, and a `cargo check` that cannot be run from a
  # macOS or Linux host (blake3 and aws-lc-sys need a Windows C toolchain) is the part that has
  # to live in CI.
  windows:
    name: check (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Parse PowerShell installers
        shell: powershell
        run: |
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            $parseTokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$parseTokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              throw ("{0}: {1}" -f $_.FullName, ($parseErrors | Out-String))
            }
          }
      - name: Read repository toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(awk -F'"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "rust-toolchain.toml declares no channel" >&2; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master commit (2026-10-16)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows
      - run: cargo check --locked --workspace --all-targets --all-features

  # Bootstrap scripts and workflow definitions are checked independently of Rust.
  shell:
    name: shellcheck + actionlint + zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install ShellCheck
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl --fail --silent --show-error --location --output "$archive" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          printf '%s  %s\n' '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198' "$archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck
      - run: bash -n scripts/*.sh
      - run: shellcheck --severity=warning scripts/*.sh
      # `actionlint` is a Go program, so it is not on crates.io and `install-action` has no recipe
      # for it — its cargo-binstall fallback reports "actionlint is not found". Installed through
      # Go instead, which the runner image ships and whose module proxy verifies the download
      # against the public checksum database.
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: actionlint
      # `actionlint` answers whether a workflow is well formed; `zizmor` answers whether it is
      # safe — an input expanded into a `run:` block, a token left in a clone, a permission
      # wider than the job needs.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: zizmor@1.31.1
      - run: zizmor .github/workflows/

  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Read repository toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(awk -F'"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "rust-toolchain.toml declares no channel" >&2; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master commit (2026-10-16)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: doc
      - run: cargo doc --locked --workspace --no-deps --all-features

  # The MSRV is read out of the manifest rather than restated here. It used to appear in the job
  # name and in the toolchain pin as well, so the one number lived in four places and nothing
  # compared them — and neither copy is read by a human deciding whether they can build this,
  # which is what the two READMEs are for.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: msrv
        run: |
          version=$(awk -F'"' '
            /^[[:space:]]*\[workspace\.package\][[:space:]]*$/ { in_section = 1; next }
            /^[[:space:]]*\[/                                   { in_section = 0 }
            in_section && /^[[:space:]]*rust-version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)
          [ -n "$version" ] || { echo "Cargo.toml declares no rust-version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master commit (2026-10-16)
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: msrv
      # `+<toolchain>` rather than a bare `cargo`: `rust-toolchain.toml` pins the build
      # toolchain for this checkout and would otherwise override the one installed above,
      # turning the only job that tests the declared floor into a duplicate of `doc`.
      - env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+$MSRV" check --locked --workspace --all-targets --all-features

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Read repository toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(awk -F'"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "rust-toolchain.toml declares no channel" >&2; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master commit (2026-10-16)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit --deny warnings

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Read repository toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(awk -F'"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "rust-toolchain.toml declares no channel" >&2; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master commit (2026-10-16)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  # A dependency that is declared and never reached still costs a version to resolve, a
  # license to clear and an advisory to answer for.
  machete:
    name: cargo machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Read repository toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(awk -F'"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "rust-toolchain.toml declares no channel" >&2; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master commit (2026-10-16)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Read repository toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(awk -F'"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "rust-toolchain.toml declares no channel" >&2; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master commit (2026-10-16)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: build-${{ matrix.os }}
      - run: cargo build --workspace --release --locked
