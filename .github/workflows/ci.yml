name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly security audit on Monday 05:00 UTC
    - cron: "0 5 * * 1"
  # `release.yml` calls this so a tag cannot publish past a gate. Called rather than duplicated:
  # the release used to restate fmt/clippy/test and therefore missed the Windows check and
  # shellcheck the moment they were added here, which is the same defect as having no coupling at
  # all, one step removed. Every gate added below now gates the release too, by construction.
  workflow_call:
    inputs:
      ref:
        # `lore schedule`-style manual releases pass a tag that is NOT `github.ref` — the dispatch
        # runs on a branch — so without this the gates would verify the branch and the archives
        # would be built from the tag. Empty for every other trigger, where `actions/checkout`
        # then defaults to the ref that triggered the run.
        description: "Commit-ish to verify; defaults to the triggering ref."
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1
  RUSTUP_MAX_RETRIES: 10

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --all-targets
      - run: cargo test --workspace --doc

  # The release builds `x86_64-pc-windows-msvc` and `install.ps1` installs it, but nothing here
  # compiled it: `google/oauth.rs` and `atlassian/oauth.rs` carry `#[cfg(target_os = "windows")]`
  # bodies that no job has ever type-checked. `--all-targets` covers the test code too, which is
  # where the platform-specific `std::os` calls live. Compile-only for now: whether the suite
  # PASSES on Windows is a separate question, and a `cargo check` that cannot be run from a
  # macOS or Linux host (blake3 and aws-lc-sys need a Windows C toolchain) is the part that has
  # to live in CI.
  windows:
    name: check (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - run: cargo check --workspace --all-targets --all-features

  # `install.sh` is the documented entry point and the pipelines are what the scheduler runs, so
  # ~1400 lines of shipped shell had no gate of any kind while every Rust line had several. The
  # workflows are the same shape — `actionlint` was run by hand while reviewing them, which means
  # it was run when someone remembered to, and these files now gate the release itself.
  shell:
    name: shellcheck + actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: bash -n scripts/*.sh
      - run: shellcheck --severity=warning scripts/*.sh
      # `actionlint` is a Go program, so it is not on crates.io and `install-action` has no recipe
      # for it — its cargo-binstall fallback reports "actionlint is not found". Installed through
      # Go instead, which the runner image ships and whose module proxy verifies the download
      # against the public checksum database.
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: actionlint

  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: doc
      - run: cargo doc --workspace --no-deps --all-features

  # The MSRV is read out of the manifest rather than restated here. It used to appear in the job
  # name and in the toolchain pin as well, so the one number lived in four places and nothing
  # compared them — and neither copy is read by a human deciding whether they can build this,
  # which is what the two READMEs are for.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - id: msrv
        run: |
          version=$(awk -F'"' '
            /^[[:space:]]*\[workspace\.package\][[:space:]]*$/ { in_section = 1; next }
            /^[[:space:]]*\[/                                   { in_section = 0 }
            in_section && /^[[:space:]]*rust-version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)
          [ -n "$version" ] || { echo "Cargo.toml declares no rust-version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
      - run: cargo check --workspace --all-targets

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.os }}
      - run: cargo build --workspace --release --locked
