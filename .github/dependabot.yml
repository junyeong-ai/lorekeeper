version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 * * *"
      timezone: Asia/Seoul
    cooldown:
      exclude: ["*"]
    open-pull-requests-limit: 10
    ignore:
      # htmd parses with html5ever, and search, remote text and table serialization use the
      # same parser family directly (Cargo.toml). Compatible 0.40 patches remain eligible;
      # move the boundary with htmd's html5ever requirement.
      - dependency-name: html5ever
        versions: [">=0.41.0"]
      - dependency-name: markup5ever_rcdom
        versions: [">=0.41.0"]
    groups:
      patch-and-minor:
        update-types: [patch, minor]
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 * * *"
      timezone: Asia/Seoul
    cooldown:
      exclude: ["*"]
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
