version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 10
    groups:
      patch-and-minor:
        update-types: [patch, minor]
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    # The MSRV job pins dtolnay/rust-toolchain to the declared rust-version
    # on purpose; it moves only when we raise MSRV by hand, never via Dependabot.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    commit-message:
      prefix: ci
      include: scope
