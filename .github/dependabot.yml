version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 * * *"
      timezone: Asia/Seoul
    cooldown:
      exclude: ["*"]
    open-pull-requests-limit: 10
    ignore:
      # htmd's public DOM and serializer traits require this parser family to move together.
      # Compatible 0.38 patches remain eligible; change the boundary with htmd's requirements.
      - dependency-name: html5ever
        versions: [">=0.39.0"]
      - dependency-name: markup5ever_rcdom
        versions: [">=0.39.0"]
    groups:
      patch-and-minor:
        update-types: [patch, minor]
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 * * *"
      timezone: Asia/Seoul
    cooldown:
      exclude: ["*"]
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
