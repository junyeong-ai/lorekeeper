[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
# Declared once and inherited by every member, so a release bumps one line rather than
# seven that nothing compared: six of them fed no artifact, and only a mismatch on `lore`
# was ever observable.
version = "0.20.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
lk-core = { path = "crates/lk-core" }
lk-vault = { path = "crates/lk-vault" }
lk-source = { path = "crates/lk-source" }
lk-pipeline = { path = "crates/lk-pipeline" }
lk-queue = { path = "crates/lk-queue" }
lk-graph = { path = "crates/lk-graph" }
lk-dist = { path = "crates/lk-dist" }
lk-task = { path = "crates/lk-task" }

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
reqwest = { version = "0.13", features = ["json", "query", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
strum = { version = "0.28", features = ["derive"] }
clap = { version = "4", features = ["derive", "env"] }
jiff = { version = "0.2", features = ["serde"] }
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
minijinja = { version = "2", features = ["loader", "json"] }
blake3 = "1"
semver = "1"
tar = "0.4"
flate2 = "1"
htmd = "0.5"
# Pinned to the rcdom instance htmd itself resolves — `htmd::Node` IS this crate's
# `Node`, so a second copy would make the two types incompatible rather than merely
# duplicated. A different version here is a loud compile error, never a silent drift.
markup5ever_rcdom = "0.38"
feed-rs = "2"
dom_smoothie = "0.18"
url = "2"
base64 = "0.23"
sha2 = "0.11"
rand = "0.10"
dialoguer = "0.12"
unicode-normalization = "0.1"
petgraph = "0.8"
rayon = "1"
same-file = "1"
walkdir = "2"
globset = "0.4"
regex = "1"
tempfile = "3"
insta = "1.44.5"
assert_cmd = "2"
proptest = "1"
