[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
lk-core = { path = "crates/lk-core" }
lk-vault = { path = "crates/lk-vault" }
lk-source = { path = "crates/lk-source" }
lk-pipeline = { path = "crates/lk-pipeline" }
lk-queue = { path = "crates/lk-queue" }
lk-graph = { path = "crates/lk-graph" }

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
reqwest = { version = "0.13", features = ["json", "query", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
strum = { version = "0.27", features = ["derive"] }
clap = { version = "4", features = ["derive", "env"] }
jiff = { version = "0.2", features = ["serde"] }
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
minijinja = { version = "2", features = ["loader", "json"] }
strsim = "0.11"
blake3 = "1"
htmd = "0.5"
feed-rs = "2"
dom_smoothie = "0.17"
url = "2"
base64 = "0.22"
dialoguer = "0.12"
unicode-normalization = "0.1"
petgraph = "0.8"
rayon = "1"
walkdir = "2"
globset = "0.4"
regex = "1"
tempfile = "3"
proptest = "1"
