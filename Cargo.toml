[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# Declared once and inherited by every member, so a release bumps one line rather than
# seven that nothing compared: six of them fed no artifact, and only a mismatch on `lore`
# was ever observable.
version = "0.108.3"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[workspace.lints.rust]
# `forbid` rather than `deny`: this tool parses feeds, mail and HTML it did not write, and
# there is no unsafe line anywhere in it. Needing one is a decision to take in this file.
unsafe_code = "forbid"

[workspace.dependencies]
lk-core = { path = "crates/lk-core" }
lk-vault = { path = "crates/lk-vault" }
lk-source = { path = "crates/lk-source" }
lk-pipeline = { path = "crates/lk-pipeline" }
lk-queue = { path = "crates/lk-queue" }
lk-graph = { path = "crates/lk-graph" }
lk-dist = { path = "crates/lk-dist" }
lk-task = { path = "crates/lk-task" }

tokio = { version = "1", features = ["full"] }
signal-hook = { version = "0.4.5", default-features = false }
async-trait = "0.1"
reqwest = { version = "0.13", features = ["json", "query", "form"] }
# Both already in the tree through reqwest; named here because this workspace decodes a
# fetched page itself rather than through `Response::text`, which cannot be size-capped —
# `mime` reads the charset the response declares and `encoding_rs` applies it.
encoding_rs = "0.8"
mime = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2.0.0", default-features = false, features = [
  "deserialize",
] }
strum = { version = "0.28", features = ["derive"] }
clap = { version = "4", features = ["derive", "env"] }
jiff = { version = "0.2", features = ["serde"] }
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
minijinja = { version = "3.0.2", features = ["serde", "json"] }
blake3 = "1"
semver = "1"
tar = "0.4"
flate2 = "1"
htmd = "0.5"
# Match htmd's public DOM types and serializer traits. Upgrade this parser family
# together when htmd's published dependency requirements change.
html5ever = "0.38"
markup5ever_rcdom = "0.38"
feed-rs = "3"
quick-xml = { version = "0.42", features = ["encoding"] }
dom_smoothie = "0.18"
url = "2"
base64 = "0.23"
sha2 = "0.11"
rand = "0.10"
dialoguer = "0.12"
unicode-normalization = "0.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
pulldown-cmark = { version = "0.13.5", default-features = false }
pulldown-cmark-to-cmark = "23.0.0"
petgraph = "0.8"
rayon = "1"
same-file = "1"
rustix = { version = "1.1.5", features = ["fs"] }
walkdir = "2"
globset = "0.4"
regex = "1"
tempfile = "3"
insta = "1.44.5"
assert_cmd = "2"
proptest = "1"
unicode-width = "0.2"
