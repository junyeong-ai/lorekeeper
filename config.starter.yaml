# Copy to config.yaml, then set your vault location and identity.
# Add selected source/module blocks from config.example.yaml when needed.
# This local inbox needs no source credentials. Choose an authenticated agent below.
vault:
  root: ~/Documents/Obsidian Vault
  timezone: system
  locale: ko

identity:
  name: "Your name"
  email: "you@example.com"

# Host-local cadence; takes effect only after explicit OS registration.
ingest:
  source_timeout_seconds: 600  # acquisition budget per source, excluding writer-lock waiting
  # Serialized retained/projected input admission, not raw-file size or process memory.
  inputs:
    max_source_bytes: 67108864
    max_run_bytes: 268435456
  schedule: "0 7 * * *"
  # Date-window sources can opt in to outage recovery; choose an explicit start date:
  # recovery: {start_date: "2026-10-01", max_days_per_source_per_run: 3}
  # The manual inbox below uses retained current files, not historical date replay.
  originals:
    max_entry_bytes: 33554432
    max_member_bytes: 67108864
    max_source_bytes: 268435456
  # Raise entry limits explicitly for larger originals; all source limits fit 512 MiB.
  # DOCX/XLSX/PDF: `lore input install DIRECTORY`, then merge its documents block.
  # Apple Silicon macOS 14+: `lore input install-vision VISION_DIRECTORY --python python3.12`.
  # Adding vision defaults PDFs to native text + visual recognition of all pages.
  # Use pdf: {mode: native} for native-only PDFs; see config.example.yaml for page selection
  # and the mutually exclusive Tesseract literal-text OCR option.

sources:
  manual-inbox:
    type: manual
    enabled: true
    params:
      inbox_dir: inbox
      # Originals are preserved; collected entries move to inbox/archived after durable publication.
      archive_after_ingest: true
    labels: [knowledge]
    concept_policy: supported-new

llm:
  provider: queue

# Maximum session duration is an explicit operating budget, in seconds.
# To use Codex instead, change engine to codex and authenticate its CLI.
execution:
  default_profile: primary
  # JSON byte limits for bounded workers; calls reset per run/knowledge batch.
  # A profile's optional work fields override these shared defaults.
  work:
    extraction_context: progressive  # screen complete candidate cards, then read selected bodies
    max_input_bytes: 262144
    max_result_bytes: 32768
    max_calls: 64
    max_parallel: 1  # ready evidence observers; screening and publication remain serial
  profiles:
    primary:
      engine: claude-code
      timeout_seconds: 3600
