[package]
name = "lk-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
lk-core = { workspace = true }
lk-vault = { workspace = true }
lk-queue = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
jiff = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Named zones come from the SYSTEM tzdb on Unix (`jiff-tzdb-platform` activates only on
# Windows/wasm), so tests that assert zone arithmetic fail on an image without `tzdata`.
# Bundled here rather than skipped, because the arithmetic is what those tests are for —
# and only for tests: the shipped binary keeps reading the OS tzdb, which stays current.
jiff = { workspace = true, features = ["tzdb-bundle-always"] }
tempfile = "3"
lk-queue = { workspace = true, features = ["test-util"] }
proptest = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
