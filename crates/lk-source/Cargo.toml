[package]
name = "lk-source"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
lk-core = { workspace = true }
lk-task = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jiff = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
htmd = { workspace = true }
markup5ever_rcdom = { workspace = true }
feed-rs = { workspace = true }
dom_smoothie = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
blake3 = { workspace = true }
emojis = "0.9"

[dev-dependencies]
# Named zones come from the SYSTEM tzdb on Unix (`jiff-tzdb-platform` activates only on
# Windows/wasm), so tests that assert zone arithmetic fail on an image without `tzdata`.
# Bundled here rather than skipped, because the arithmetic is what those tests are for —
# and only for tests: the shipped binary keeps reading the OS tzdb, which stays current.
jiff = { workspace = true, features = ["tzdb-bundle-always"] }
strum = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
proptest = { workspace = true }
