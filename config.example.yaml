# Lorekeeper configuration
# Start with config.starter.yaml; copy only the source/module blocks you need from here.
# This reference catalog keeps every source disabled until you select its real scope.
# /lore-setup discovers account IDs and validates your selection.
# RSS needs no account: ai-news and tech-news offer selected and optional feeds.
#
# Location (auto-discovered in this order):
#   1. --config / LORE_CONFIG
#   2. ./config.yaml                       (running from a repo checkout)
#   3. ~/.config/lorekeeper/config.yaml     (binary-only install)

# ─── Vault paths ──────────────────────────────────────────
vault:
  root: ~/Documents/Obsidian Vault
  timezone: system          # IANA name (e.g., "Asia/Seoul") or "system"
  locale: ko                # language for generated prose and headings: ko | en
                            # (source content — mail/Slack/Jira bodies — is never translated)
  dirs:
    daily: daily
    weekly: weekly
    monthly: monthly
    quarterly: quarterly
    annual: annual
    personal: me
    synthesis: synthesis
    wiki: wiki

# ─── Identity ─────────────────────────────────────────────
identity:
  name: "홍길동"
  email: "gildong.hong@company.com"
  # Slack user id — attributes your own channel posts to your work-log.
  # (Jira needs nothing here: ownership is derived from the authenticated account.)
  slack_id: "U0123456789"

# Optional shared store for multiple vaults using the same accounts. Relative paths
# resolve against this config file. Omitted: <vault>/.lorekeeper/credentials.json.
# Share the file rather than copying rotating OAuth refresh tokens.
# credentials:
#   file: ~/.config/lorekeeper/credentials.json

# ─── Ingestion schedule ───────────────────────────────────
# A single daily run over ALL enabled sources. `lore schedule` emits ONE `lore run daily`
# crontab line from this. Ingestion is not scheduled per source: the work-log aggregates
# personal events across sources. Source failures remain explicit and can block reviews.
ingest:
  source_timeout_seconds: 600  # total acquisition budget per source, including retry waits
  schedule: "0 7 * * *"          # every day 07:00 (sources use lookback windows)
  # Explicit opt-in: native daily retries missing CLOSED query days before current collection.
  # Choose the earliest day you intend to recover; no history is inferred from installation.
  # recovery:
  #   start_date: "2026-10-01"
  #   max_days_per_source_per_run: 3
  # Only date-window adapters replay automatically. RSS/Slack search/arbitrary Jira JQL
  # cannot prove historical coverage; manual/nodex collect current retained inputs.
  # A replay queries current provider records, not deleted/intermediate revisions.
  # Raw originals use private temporary files, separate from decoded/model output.
  # Entry/member limits must fit max_source_bytes; the full ingest capture cap is 512 MiB.
  originals:
    max_entry_bytes: 33554432     # 32 MiB per inbox entry; raise explicitly for larger inputs
    max_member_bytes: 67108864    # 64 MiB per locally referenced attachment
    max_source_bytes: 268435456   # 256 MiB captured originals per manual source
  # Optional native DOCX/XLSX/PDF decoder (macOS/Linux): `lore input install DIRECTORY`.
  # Add visual PDF/image recognition on Apple Silicon macOS 14+ with
  # `lore input install-vision VISION_DIRECTORY --python python3.12`.
  # Both installers use new directories and print configuration to merge here.
  # Relative paths here resolve against this config file, not vault.root.
  # documents:
  #   python: ~/.local/share/lorekeeper/documents/venv/bin/python
  #   timeout_seconds: 120            # whole projection; source acquisition has a separate budget
  #   max_output_bytes: 33554432       # aggregate serialized decoder output
  #   max_decoded_bytes: 134217728     # aggregate projected text/structure; literal OCR also bounds RGBA
  #   max_raster_bytes: 67108864       # per pending physical page/frame; excludes decoder/model overhead
  #   max_units: 10000                 # native and visual/OCR units count separately for PDF
  #   vision:
  #     engine: paddle-ocr-vl
  #     python: ~/.local/share/lorekeeper/vision/layout/venv/bin/python
  #     vlm_python: ~/.local/share/lorekeeper/vision/vlm/venv/bin/python
  #     models_dir: ~/.local/share/lorekeeper/vision/models
  #   # With vision, omitted pdf means visual recognition of every page plus native text.
  #   # Explicit native skips visual work; selected visual pages are ascending, 1-based:
  #   # pdf: {mode: native}
  #   # pdf: {mode: visual, pages: [1, 3]}
  # For native-only documents, omit vision. For literal OCR, replace vision with:
  #   ocr:
  #     tessdata_dir: ~/.local/share/lorekeeper/tessdata
  #     languages: [kor, eng]     # explicitly installed <language>.traineddata files
  #     layout: auto              # auto | single-block | sparse-text; no automatic retry
  #     pdf: false               # true: additional OCR for every PDF page

# ─── Source definitions ───────────────────────────────────
# key = stable source ID; daily sources use daily/<id>, document sources use wiki/documents.
# You can define several sources of the same type.
# Optional source-level collection_timeout_seconds overrides the global acquisition budget.
# The deadline cancels async waits; blocking local IO/decoding is checked when it returns.
# concept_policy: disabled collects without concepts; existing-only links known
# subjects; supported-new also admits directly supported durable new subjects.
# focus narrows semantic relevance independently of the admission policy.
sources:

  # ── Intelligence (external trends) ──
  # google-drive: collect curated docs (briefings, etc.) from a shared Drive folder, file by file.
  drive-briefings:
    type: google-drive
    enabled: false
    params:
      folder_id: "YOUR_DRIVE_FOLDER_ID" # copy the ID from the Drive folder URL; "root" is valid
      lookback_days: 1                 # target civil day plus previous day; recovery handles longer query gaps
      # name_prefix: "briefing-"       # optional filename prefix, not a date or glob pattern
      # max_files: 200                 # a reached cap is a partial observation
    labels: [ai-industry]
    concept_policy: supported-new

  # ── Team (team observation) ──
  # The whole channel = team activity. Messages you authored are split into the work-log
  # automatically (this source is in personal.tracked_sources + identity.slack_id). Most
  # conversation is threaded, so include_threads pulls reply context too.
  team-slack:
    type: slack-channel
    enabled: false
    params:
      # a single `channel`, or channels: ["C0123…", "#name"] (multiple, ids and names mixed)
      channels: ["#aix-team-digest"]
      lookback_hours: 24
      include_threads: true     # include thread replies as context
      exclude_bots: true        # drop bot/integration messages (default true)
      # watch_users: ["U0123…"] # (optional) only threads a given user authored or was mentioned in; empty = all
      # max_messages_per_channel: 500 # (optional) per-run history cap; raise for very busy channels
      # max_thread_messages: 200      # (optional) per-thread fetch cap (root message + replies)
    labels: [team-ops]
    concept_policy: existing-only

  # ── Personal (my activity — collected directly) ──
  my-tasks:
    type: jira
    enabled: false
    # instance: default         # (optional) which credentials.atlassian entry authenticates
                                # this source; required only when several are configured
    params:
      # Current issues selected by updated time, not proof of who performed the work.
      # Status, assignee and planned dates are values at acquisition. Historical replay
      # does not reconstruct their old values, and this JQL is not date-coverage proof.
      # The JQL decides what is PROPOSED as well as what is ingested: an issue
      # outside this window is never fetched, so it is never declared open.
      # To have work still open proposed each morning, widen it — e.g.
      #   assignee = currentUser() AND (updated >= -1d OR statusCategory != Done)
      jql: >
        assignee = currentUser()
        AND updated >= -1d
        ORDER BY updated DESC
      # max_issues: 200           # (optional) per-run cap; the fetch paginates the whole
                                  # JQL result and warns if this cap actually drops issues
    labels: [personal]
    concept_policy: existing-only

  # Confluence observations include the current page version in their event identity.
  # Completed semantic results are reused only when their exact input hashes still match.
  # A date query selects current records; it does not restore prior page versions.
  my-wiki:
    type: confluence
    enabled: false
    # instance: default
    params:
      # CQL filter only; the adapter adds the target day's modification window and ordering.
      # Provider functions such as now() use acquisition time, even with --date in the past.
      # CQL grammar is validated by Confluence when fetching, not by `lore validate`.
      cql: >
        type = page AND contributor = currentUser()
      # lookback_hours: 24
      # max_pages: 50             # per-run cap; the fetch paginates the whole CQL result
      # only_my_edits: true       # keep only pages whose CURRENT version I authored.
                                  # `contributor = currentUser()` also matches pages someone
                                  # else last edited — knowledge to read, but not my work.
                                  # Set false to ingest those too (they stay is_self: false,
                                  # so they never reach the work-log).
    labels: [personal]
    concept_policy: supported-new

  my-schedule:
    type: google-calendar
    enabled: false
    params:
      calendar_id: primary
      lookback_hours: 24
      lookahead_hours: 24
      fetch_meeting_notes: true  # auto-extract meeting notes from Google Drive links
      # max_events: 500           # (optional) per-run cap; the fetch paginates the whole
                                  # window and warns if this cap actually drops events
    labels: [personal]
    concept_policy: existing-only

  email-digest:
    type: gmail
    enabled: false
    params:
      lookback_hours: 24
      # max_messages: 200 # (optional) per-day fetch cap; raise for busy accounts or backfills
      # Prefer a STABLE filter (recipient/sender) over `is:unread`: the daily page is a
      # complete-refetch view, so a read-state filter makes it depend on what you've opened
      # in Gmail — re-ingesting a past day would then yield a different result. Each line
      # carries `-label:ai-news` so newsletters split out to the ai-newsletters source below.
      include_queries:
        - "to:gildong.hong@company.com -label:ai-news"
        - "cc:gildong.hong@company.com -label:ai-news"
        - "from:@company.com -label:ai-news"      # org broadcast / alias announcements
        # `is:unread` is allowed but read-state-dependent — use it only if you deliberately
        # want "mail I haven't read yet" and accept that re-ingest is not reproducible.
      # Keep invitations when email is your only meeting source. Exclude only noise
      # observed in your own mailbox; broad automated-sender rules can hide useful work.
      exclude:
        calendar_invites: false
        # subjects: []
        # senders: []
    # Optional daily-page presentation buckets. First keyword match wins; a match
    # does not establish intent, approval or factual correctness. Leave absent for
    # chronological rendering and semantic concept extraction.
    # classify:
    #   - category: knowledge_sharing
    #     keywords: ["FYI", "공유드립니다"]
    # highlights:
    #   - { category: knowledge_sharing, label: "지식 공유" }
    labels: [personal, team-ops]
    concept_policy: supported-new

  # ── Trends (trend analysis) ──
  slack-trends:
    type: slack-search
    enabled: false
    params:
      queries:
        - channel: "#ai-general"
          keywords: [AI, LLM, GenAI, Claude, GPT]
        - channel: "#dev-talk"
          keywords: [MCP, RAG, vector, embedding]
      lookback_hours: 24
      # max_matches_per_query: 200 # (optional) per-query cap; the search paginates all
                                   # result pages and warns if this cap drops matches
    labels: [ai-internal, strategy]
    concept_policy: supported-new

  # ── Knowledge (knowledge accumulation) ──
  # Accumulate external AI/tech news into wiki/concepts as a growing knowledge graph.
  # Keeping it out of personal.tracked_sources keeps the work-log/reviews clean. Leave
  # classify empty to avoid keyword misclassification; structuring is left to concept
  # extraction + `lore graph cluster`/`suggest-links`.

  # RSS/Atom needs no authentication. Start with the selected feeds below; uncomment
  # complementary sources when you need their coverage, rather than enabling every feed.
  # Keep feed IDs stable: they namespace retained observations, not display labels.
  # A feed must supply published/updated dates; missing dates are not replaced with today.
  # fetch_full_text requests the linked page when RSS supplies only an excerpt/link.
  # It adds HTTP work; failures retain the feed text and cannot establish unread article claims.
  ai-news:
    type: rss
    enabled: false
    params:
      # Target civil day plus three earlier days, filtered against the current feed.
      # Feeds are finite listings: this does not guarantee historical coverage or recovery
      # after a long outage. Retained event logs preserve observations already collected.
      lookback_hours: 72
      max_items_per_feed: 100        # safety cap, not a relevance filter; raise if a run reports truncation
      feeds:
        # Official announcements/research and open-model engineering. These feeds provide
        # excerpts or links; vendor claims remain attributed, not independent validation.
        - { id: openai,            url: "https://openai.com/news/rss.xml", fetch_full_text: true }
        - { id: deepmind,          url: "https://deepmind.google/blog/rss.xml", fetch_full_text: true }
        - { id: hf-blog,           url: "https://huggingface.co/blog/feed.xml", fetch_full_text: true }
        # Practitioners: model methods, AI implementation and product evaluation.
        # These feeds already carry article bodies; no second fetch is needed by default.
        - { id: sebastian-raschka, url: "https://magazine.sebastianraschka.com/feed" }
        - { id: simon-willison,    url: "https://simonwillison.net/tags/ai.atom" }
        - { id: hamel-husain,      url: "https://hamel.dev/index.xml" }
        # Optional: broader vendor coverage, applied cloud work and academic research.
        # - { id: google-ai,       url: "https://blog.google/innovation-and-ai/technology/ai/rss/", fetch_full_text: true }
        # - { id: aws-ml,          url: "https://aws.amazon.com/blogs/machine-learning/feed/" }
        # - { id: ms-research,     url: "https://www.microsoft.com/en-us/research/feed/" }
        # - { id: bair,            url: "https://bair.berkeley.edu/blog/feed.xml" }
        # Optional: research/policy interpretation, AI engineering interviews and essays.
        # Publication cadence varies; a quiet feed is not necessarily broken.
        # - { id: import-ai,       url: "https://importai.substack.com/feed" }
        # - { id: latent-space,    url: "https://www.latent.space/feed" }
        # - { id: the-gradient,    url: "https://thegradient.pub/rss/" }
    labels: [ai-tech]
    concept_policy: supported-new
    focus: >
      AI/ML의 모델·학습·추론·데이터·에이전트·평가·안전성·거버넌스와 실제 엔지니어링의 기법·제약을 다룬다.
      개념은 본문이 정의·작동 방식·적용 조건을 설명하는 지속적인 탐색 주제로 추출한다.
      이름만 나열된 제품 발표·투자·가격·행사 소식은 새 개념의 근거로 삼지 않는다.
      벤더의 주장, 연구 결과, 실무자의 해석을 구분하고 버전·환경·한계와 출처를 보존한다.

  # Engineering accounts from domestic practitioners. Aggregators are optional discovery
  # channels: they add volume and may repeat the same primary article across feeds.
  # focus guides summaries and concept extraction; it does not filter raw collection.
  tech-news:
    type: rss
    enabled: false
    params:
      lookback_hours: 72
      max_items_per_feed: 100
      feeds:
        # In-depth engineering: systems, architecture, delivery and production lessons.
        - { id: naver-d2,    url: "https://d2.naver.com/d2.atom" }
        - { id: kakao-tech,  url: "https://tech.kakao.com/feed", fetch_full_text: true }
        - { id: woowahan,    url: "https://techblog.woowahan.com/feed/" }
        - { id: toss-tech,   url: "https://toss.tech/rss.xml" }
        # Optional: English/Korean discovery. HN points select popularity, not accuracy;
        # GeekNews links to its own summaries/discussion, not necessarily the primary article.
        # - { id: hacker-news, url: "https://hnrss.org/frontpage?points=100", fetch_full_text: true }
        # - { id: geeknews,    url: "https://news.hada.io/rss/news", fetch_full_text: true }
    labels: [tech]
    concept_policy: supported-new
    focus: >
      소프트웨어 설계·개발 방법·시스템·데이터·보안·운영·개발 도구의 실제 기법과 트레이드오프를 다룬다.
      개념은 본문이 설명하는 지속적인 탐색 주제로 추출하고 일회성 홍보·인물 소식·생활·정치·일반 시사는 제외한다.
      집계 사이트의 소개·댓글과 원저자의 설명을 구분하며 제목·링크만으로 원문의 결론을 추론하지 않는다.
      사례의 환경·버전·적용 조건과 한계를 보존하고 같은 기사를 재인용한 소식들을 독립적인 검증으로 세지 않는다.

  # Email newsletters (subscriptions with no RSS) — routed in Gmail by the `ai-news` label (set the filter once).
  # email-digest excludes the same mail via `-label:ai-news`, so they aren't ingested twice.
  ai-newsletters:
    type: gmail
    enabled: false
    params:
      lookback_hours: 24
      include_queries:
        - "label:ai-news"
    labels: [ai-tech]
    concept_policy: supported-new

  # Optional repository adapter. nodex supplies declared document identity and lifecycle;
  # Lorekeeper keeps an evidence copy and synthesizes cross-project concepts.
  # Requires nodex >=0.60,<0.61 and a current index compatible with that binary.
  # Repositories without nodex can use /lore-extract's explicit extraction manifest.
  platform-docs:
    type: nodex
    enabled: false
    params:
      repo: /absolute/path/to/your/repo   # absolute: a scheduled run starts nowhere in particular
      # Optional side-by-side binary; omitted uses nodex on PATH. No shell/tilde expansion.
      # executable: /absolute/path/to/tools/nodex-0.60.0/nodex
      # Stable namespace, independent of checkout location; never reuse for another repository.
      repository_id: github.com/org/repo
      # Choose exact kinds from `nodex export enums`; repositories may call decisions
      # `decision` or `adr`. This list is an example, not a shared kind vocabulary.
      kinds: [learning, decision]
      # Reconcile current inventory, including undated lessons and lifecycle-only edits.
      # This reads the local checkout, never pulls Git or deletes retired vault evidence.
      reconcile: true
      # Refuse the whole selection above this cap; never silently truncate.
      max_documents: 200
      # For a large repository, select the relevant kinds/IDs deliberately. A cheaper
      # date-window alternative is reconcile: false + lookback_hours: 24, but it admits
      # only author-dated changes, not every changed body or lifecycle attribute.
      # Exact IDs within selected kinds and, unless reconciling, the date window.
      # document_ids: [exact-document-id]
      # The prefix a document's repo-relative path is appended to, so a citation links back
      # to the real record. Omit it for a repo with no remote — a local path is provenance
      # that resolves nowhere but this machine.
      base_url: "https://github.com/org/repo/blob/main"
    labels: [project-knowledge]
    concept_policy: supported-new
    # The focus is what keeps the graph general. The repository already holds the
    # project-specific half, so only what a DIFFERENT project could cite earns a page.
    focus: >
      여러 프로젝트에 옮겨 쓸 수 있는 패턴·실패 모드·플랫폼 제약·방법론만 개념화할 것.
      이 저장소에만 해당하는 모듈명·티켓 번호·환경명·설정 키·파일 경로는 개념화하지 말 것.
      관찰·가설·규칙을 구분하고 원문이 밝힌 버전·환경·적용 조건 및 결정의 상태·대체 관계를 보존할 것.

  # Manual curation — drop files into the <vault>/inbox/ directory and they become
  # individual wiki/documents/{slug}.md document pages (LLM summary + concept extraction included).
  # HTML is run through a readability extractor to extract the body, then converted to Markdown.
  # Exact originals and supported local dependencies are preserved before page publication.
  # Eligible unchanged entries move to inbox/archived/{date}/ after durable page/request publication.
  # Incomplete dependency coverage or capture failures retain inputs; assets are never removed.
  manual-inbox:
    type: manual
    enabled: false
    params:
      # Relative paths anchor at vault.root. Keep raw input separate from all managed
      # vault.dirs roots and .lorekeeper, including symlink targets.
      inbox_dir: inbox
      # Omitted: text plus configured document/OCR formats. Other known binary inputs
      # are retained with a diagnostic; explicit selection requires its decoder.
      # An explicit list narrows selection; unsupported files remain untouched.
      # extensions: [md, txt, markdown, html, htm, docx, xlsx, pdf, png, jpg, tiff, webp]
      # Override the global PDF policy for this source; visual requires documents.vision.
      # pdf: {mode: visual, pages: [1, 3]}
      # pdf: {mode: native}
      archive_after_ingest: true  # auto-archive after processing (default true)
    labels: [knowledge]
    concept_policy: supported-new

  # Your own finished tasks. This is the other half of the task board below: closing a task
  # records it, and this reads that record so the day's work lands on a daily page like any
  # other source's. It is what makes work that touched no SaaS — reading, deciding, debugging
  # — visible to the work-log and to a performance review at all.
  # Requires `personal.tasks` (and vice versa); `lore validate` says so if only one is here.
  # NOTE: list this id in `personal.tracked_sources` below. Without it the completions still
  # get their own daily page, but they never reach the work-log or any review — which is the
  # one thing this source exists for.
  my-work:
    type: tasks
    enabled: false
    labels: [personal]
    concept_policy: existing-only

# ─── Personal module (OPTIONAL) ───────────────────────────
# The personal-productivity module: the work-log + weekly/monthly/quarterly/annual personal
# reviews + the contribution taxonomy. OMIT this whole `personal:` block for a pure,
# domain-neutral knowledge engine — then no work-log, no reviews, and no performance
# categories are produced. Its PRESENCE (not a flag) turns the subsystem on.
personal:
  # Sources whose own-authored events feed the work-log and reviews. A source not listed
  # here still flows to the concept graph and daily pages — it just isn't "my activity".
  # (Ownership within a tracked source is still exact: Slack uses identity.slack_id, Jira the
  # authenticated account, Gmail From matches identity.email; Calendar matches organizer
  # or attendees. Email recipients and free-text mentions do not establish authorship.)
  tracked_sources: [team-slack, my-tasks, my-schedule, email-digest, my-work]
  performance_categories:
    - project-delivery
    - technical-leadership
    - team-contribution
    - innovation
    - operational-excellence
  uncategorized_label: "기타"
  # Per-source-ID override (highest priority). Use when same-type sources need
  # different categories (e.g., my-tasks → project-delivery, sre-tasks → operational-excellence).
  source_category_map: {}
  # Per-source-type fallback. Applied when source_category_map has no entry for this source.
  source_type_category_map:
    jira: project-delivery
    google-calendar: team-contribution
  # The task board: what you mean to do, which becomes what you did.
  # Its PRESENCE turns the board on. `lore task` writes <personal>/tasks.md — five sections
  # (today / proposed / next / waiting / someday) of ordinary markdown checkboxes you can also edit in
  # Obsidian, on a phone; `lore task sync` picks up whatever you changed there. Closing a task
  # records it, and the `tasks` source above turns that record into a page.
  tasks:
    board: tasks.md                 # relative to vault.dirs.personal
    carry_warn_after: 3             # the agenda flags a task carried this many day-closes
    # Sources whose PROSE an LLM session may read to propose work. Opt-in and empty by
    # default: a Jira issue's status category is the provider's own fixed vocabulary, so an
    # adapter declares "unfinished" without reading a word and cannot be wrong — while "does
    # this mail ask me to do something" has no such field, and a rule over subject lines would
    # fire on every newsletter. Structural proposals need nothing here.
    # propose_from: [email-digest]
  # Monthly/quarterly/annual review schedules. The weekly review rides `lore synthesis
  # weekly` (scheduled under synthesis.weekly below), so it has no separate schedule here.
  monthly:
    enabled: true
    schedule: "0 8 1 * *"           # 1st of month 08:00
  quarterly:
    enabled: true
    schedule: "0 8 1 1,4,7,10 *"    # Quarter starts (Jan/Apr/Jul/Oct)
  annual:
    enabled: true
    schedule: "0 8 1 1 *"           # Jan 1st 08:00

# ─── Synthesis reports (cross-source themes) ──────────────
# A cross-source "weekly themes" page over include_sources (opt-in), written to
# synthesis/weekly/. This is domain-neutral knowledge synthesis, independent of the personal
# module — though `lore synthesis weekly` also produces the personal weekly review when a
# `personal:` block is configured above.
synthesis:
  # recovery:
  #   start_date: "2026-10-01"      # opt in to full closed periods starting on/after this date
  #   max_periods_per_run: 8        # examined slots; resumes a persisted cursor, no collection proof
  weekly:
    enabled: true
    schedule: "0 8 * * 1"           # Monday 08:00
    # Work/communication sources only — the context where a weekly theme retro is valuable. Don't
    # include knowledge feeds like news/RSS (they already accumulate continuously in the concept
    # graph, so a weekly digest would be redundant).
    include_sources: [team-slack, slack-trends]

# ─── Concept categorization ───────────────────────────────
# Concept categorization for wiki/concepts/ pages.
# Categories give the LLM a fixed vocabulary when assigning topics.
# They are broad browse facets, not a concept hierarchy or proof of equivalence.
# Start with a small stable vocabulary; concept definitions and supported relations
# live in the concept pages. Keep established IDs/addresses when refining labels.
# Omit the entire block to skip categorization.
concepts:
  categories:
    - id: ai-ml
      label: "AI/ML"
    - id: infrastructure
      label: "인프라"
    - id: software-engineering
      label: "소프트웨어 엔지니어링"
    - id: product-service
      label: "제품/서비스"
    - id: organization
      label: "조직/이벤트"

# ─── Graph analysis ───────────────────────────────────────
# Link graph analysis (lore graph lint/cluster/suggest-links).
# Fully optional — omit the entire block to use defaults.
# graph:
#   audit:
#     schedule: "0 7 * * 0"         # weekly semantic maintenance, independent of synthesis
#     batch_size: 5                # rotate changed and first-time concepts/documents fairly (1..100)
#     max_input_bytes: 262144      # whole distinct audit footprint; oversized subjects require completed bounded work
#                                  # requires an explicit execution profile and deployed skills
#   scope:
#     dirs: [wiki]                   # vault-relative dirs to scan (default: vault.dirs.wiki)
#     exclude: []                    # glob patterns to skip (e.g., ["wiki/drafts/**"])
#     follow_links: false            # follow symlinks during walk
#   metrics:
#     min_hub_degree: 5              # minimum total degree to flag as hub in lint
#     orphan_exclude: []             # page ids excluded from orphan reports
#   cluster:
#     resolution: 1.0                # Louvain resolution (higher = more, smaller communities)
#     max_iterations: 100            # max local-moving passes per aggregation level
#     min_community_size: 1          # drop communities smaller than this
#     suggest_min_shared_neighbors: 2  # suggest-links floor: min shared neighbors per pair (cuts co-citation noise)

# ─── Maintenance ──────────────────────────────────────────
# Retention for ingest history, drained queue files, verified published work and
# derived projection caches. Successful read/write cache reuse renews its last-use time;
# inspect/dry-run reads do not. Active claims, originals and malformed cache data are preserved.
# Work cleanup requires exclusive workflow access and verified live queue/reuse references.
# Unpublished, referenced, unowned or unreadable work is preserved. Sealing alone is not publication.
# Streaming event logs (`.lorekeeper/events/`) are the permanent raw layer — never pruned.
# Fully optional — omit the block to use the default.
# maintenance:
#   retention_days: 90               # how long pruned history (ingest log entries,
#                                    # drained queue/processed files) is kept
#   schedule: "0 6 * * 0"            # cron for `lore schedule` to emit unattended
#                                    # `lore maintenance --prune-queue --wait-for-vault`

# Semantic work storage is independent of the agent that consumes it.
# queue preserves typed requests; noop performs no LLM work.
llm:
  provider: queue

# Choose an authenticated CLI. No credentials belong in this configuration.
# timeout_seconds is an explicit per-session wall-clock budget.
execution:
  default_profile: primary
  # Bounded worker requests/results are compact JSON bytes, not model tokens or cost.
  # Native execution splits evidence and reduces observations in fresh sessions.
  work:
    max_input_bytes: 262144        # >=4096; serialized evidence request, not total model context
    max_result_bytes: 32768        # >=1024 and <=max_input_bytes/4
    max_calls: 64                  # per daily/process run, or per knowledge batch; >0
  profiles:
    primary:
      engine: claude-code
      timeout_seconds: 3600
      # executable: /absolute/path/to/claude
      # model: <model available to this CLI account>
      # config_directory: /existing/claude/profile
    # reviewer:
    #   engine: codex
    #   timeout_seconds: 3600
    #   executable: /absolute/path/to/codex
    #   profile: <existing Codex profile name>
    #   work:                       # only specified fields override execution.work
    #     max_input_bytes: 131072
    #     max_result_bytes: 16384
    #     max_calls: 32
  # operations:
  #   knowledge: reviewer
