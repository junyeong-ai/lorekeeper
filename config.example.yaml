# Lorekeeper configuration
# Copy to config.yaml and customize for your environment.
# config.yaml is gitignored — safe for personal settings.
#
# Location (auto-discovered in this order):
#   1. --config / LORE_CONFIG
#   2. ./config.yaml                       (running from a repo checkout)
#   3. ~/.config/lorekeeper/config.yaml     (binary-only install)

# ─── Vault 경로 ───────────────────────────────────────────
vault:
  root: ~/Documents/Obsidian Vault
  timezone: system          # IANA name (e.g., "Asia/Seoul") or "system"
  locale: ko                # output language for added labels/headers: ko | en
                            # (source content — mail/Slack/Jira bodies — is never translated)
  dirs:
    daily: daily
    weekly: weekly
    monthly: monthly
    quarterly: quarterly
    annual: annually
    personal: me
    wiki: wiki

# ─── 사용자 식별 ──────────────────────────────────────────
identity:
  name: "홍길동"
  email: "gildong.hong@company.com"
  slack_id: "U0123456789"
  jira_id: "gildong.hong"

# ─── 소스 정의 ────────────────────────────────────────────
# 키 = 소스 ID = daily/ 하위 디렉토리명
# 같은 type으로 여러 소스를 정의할 수 있습니다.
sources:

  # ── Intelligence (외부 동향) ──
  # google-drive: 공유 Drive 폴더에 큐레이션된 문서(브리핑 등)를 파일 단위로 수집.
  drive-briefings:
    type: google-drive
    enabled: false
    schedule: "0 7 * * 1-5"
    params:
      folder: "AI-Briefing/briefings"
      file_pattern: "briefing-{date}.md"
    labels: [ai-industry]
    extract_concepts: true
    track_personal: false

  # ── Team (팀 관찰) ──
  # 채널 전체 = 팀 업무 현황. 내가 쓴 메시지는 work-log로 자동 분리(track_personal +
  # identity.slack_id). 대화 대부분이 쓰레드라 include_threads로 답글 맥락까지 모읍니다.
  team-slack:
    type: slack-channel
    enabled: true
    schedule: "0 9 * * 1-5"
    params:
      # 단일 channel 또는 channels: ["C0123…", "#name"] (복수, id/이름 혼용 가능)
      channels: ["#aix-team-digest"]
      lookback_hours: 24
      include_threads: true     # 쓰레드 답글까지 맥락 포함
      exclude_bots: true        # 봇/통합 메시지 제외 (기본 true)
      # watch_users: ["U0123…"] # (선택) 특정 사용자가 쓰거나 멘션된 쓰레드만; 비우면 전체
    labels: [team-ops]
    extract_concepts: true
    track_personal: true

  # ── Personal (내 활동 — 직접 수집) ──
  my-tasks:
    type: jira
    enabled: true
    schedule: "0 9 * * 1-5"
    params:
      # 그날 변경된(=작업한) 이슈 = 작업 이력 스냅샷. 마감/시작일은 그날 시점 값으로
      # 페이지에 표시되지만, 검색 기준은 updated (날짜 변경에 의한 과거 오염 방지).
      jql: >
        assignee = currentUser()
        AND updated >= -1d
        ORDER BY updated DESC
      max_results: 50
    labels: [personal]
    extract_concepts: false
    track_personal: true

  my-schedule:
    type: google-calendar
    enabled: true
    schedule: "0 8 * * 1-5"
    params:
      calendar_id: primary
      lookback_hours: 24
      lookahead_hours: 24
    labels: [personal]
    extract_concepts: false
    track_personal: true

  email-digest:
    type: gmail
    enabled: true
    schedule: "30 8 * * 1-5"
    params:
      lookback_hours: 24
      # 업무 메일만. `-label:ai-news`로 뉴스레터를 work-log에서 분리 — 아래
      # ai-newsletters 소스가 `label:ai-news`를 전담하므로 두 스트림은 상호배타.
      include_queries:
        - "is:unread -category:promotions -category:social -category:updates -label:ai-news"
        - "from:@oliveyoung.co.kr is:unread -label:ai-news"
        - "from:@cj.net is:unread -label:ai-news"
      exclude:
        subjects: ["[Automated]", "noreply", "no-reply"]
        senders: ["notifications@", "mailer-daemon@", "calendar-notification@"]
    # 키워드 → 분류 (소스 레벨, params와 분리)
    classify:
      action_required: ["action required", "please review", "검토 요청", "확인 부탁"]
      decisions: ["approved", "결재 완료", "승인"]
      project_updates: ["진행 상황", "업데이트", "progress"]
      knowledge_sharing: ["공유드립니다", "FYI", "참고"]
      meeting_followup: ["회의록", "action items", "후속"]
    labels: [personal, team-ops]
    extract_concepts: true
    track_personal: true

  # ── Trends (트렌드 분석) ──
  slack-trends:
    type: slack-search
    enabled: true
    schedule: "0 10 * * 1-5"
    params:
      queries:
        - channel: "#ai-general"
          keywords: [AI, LLM, GenAI, Claude, GPT]
        - channel: "#dev-talk"
          keywords: [MCP, RAG, vector, embedding]
      lookback_hours: 24
    labels: [ai-internal, strategy]
    extract_concepts: true
    track_personal: false

  # ── Knowledge (지식 자산화) ──
  # 외부 AI/테크 소식을 wiki/concepts에 누적해 지식 그래프로 축적. track_personal:false라
  # work-log/성과 리뷰는 오염되지 않음. classify를 비워 키워드 오분류를 피하고, 구조화는
  # 개념 추출 + `lore graph cluster`/`suggest-links`에 맡긴다.

  # RSS/Atom 피드 — 인증 없이 벤더 블로그·애그리게이터를 폴링. 한 소스가 여러 피드 처리.
  ai-news:
    type: rss
    enabled: false
    schedule: "0 7 * * *"
    params:
      lookback_hours: 24
      max_items_per_feed: 50
      feeds:
        # 벤더
        - { id: openai,            url: "https://openai.com/news/rss.xml" }
        - { id: deepmind,          url: "https://deepmind.google/blog/rss.xml" }
        - { id: google-ai,         url: "https://blog.google/technology/ai/rss/" }
        - { id: hf-blog,           url: "https://huggingface.co/blog/feed.xml" }
        # 클라우드 / 응용 / 연구소
        - { id: aws-ml,            url: "https://aws.amazon.com/blogs/machine-learning/feed/" }
        - { id: ms-research,       url: "https://www.microsoft.com/en-us/research/feed/" }
        - { id: bair,              url: "https://bair.berkeley.edu/blog/feed.xml" }
        # 실무자 / 심층 분석
        - { id: sebastian-raschka, url: "https://magazine.sebastianraschka.com/feed" }
        - { id: simon-willison,    url: "https://simonwillison.net/atom/everything/" }
        # 애그리게이터 / 뉴스레터(RSS)
        - { id: import-ai,         url: "https://importai.substack.com/feed" }
        - { id: latent-space,      url: "https://www.latent.space/feed" }
        - { id: the-gradient,      url: "https://thegradient.pub/rss/" }
        # 한글 AI
        - { id: aitimes,           url: "https://www.aitimes.com/rss/allArticle.xml" }
        # 옵션(고볼륨 연구 firehose — 활성화 시 max_items_per_feed를 작게):
        # - { id: arxiv-cs-lg,     url: "http://export.arxiv.org/rss/cs.LG" }
    labels: [ai-tech]
    extract_concepts: true
    focus: "AI/ML 모델·기법·아키텍처·인프라·도구·연구 등 AI 기술 주제."
    track_personal: false

  # 폭넓은 테크 동향 + 한글 — 애그리게이터(HN/긱뉴스) + 국내 엔지니어링 블로그.
  # 애그리게이터는 비-기술 노이즈(인물/정치/생활)가 섞이므로 focus(LLM 관련성 필터)로
  # 기술 주제만 개념화 — 노이즈는 그래프에 쌓이지 않음.
  tech-news:
    type: rss
    enabled: false
    schedule: "0 7 * * *"
    params:
      lookback_hours: 24
      max_items_per_feed: 25
      feeds:
        # 애그리게이터 (영문/한글)
        - { id: hacker-news, url: "https://hnrss.org/frontpage?points=100" }
        - { id: geeknews,    url: "https://news.hada.io/rss/news" }
        # 국내 엔지니어링 블로그 (심층)
        - { id: naver-d2,    url: "https://d2.naver.com/d2.atom" }
        - { id: kakao-tech,  url: "https://tech.kakao.com/feed/" }
        - { id: woowahan,    url: "https://techblog.woowahan.com/feed/" }
        - { id: toss-tech,   url: "https://toss.tech/rss.xml" }
        - { id: yozm-it,     url: "https://yozm.wishket.com/magazine/feed/" }
    labels: [tech]
    extract_concepts: true
    focus: "소프트웨어 엔지니어링·AI/ML·시스템·개발 도구·인프라 등 기술 주제만. 인물 부고·생활·정치·일반 시사 등 비기술 항목은 개념화하지 말 것."
    track_personal: false

  # 이메일 뉴스레터(RSS 없는 구독) — Gmail에서 `ai-news` 라벨로 라우팅(필터 1회 설정).
  # email-digest는 `-label:ai-news`로 같은 메일을 배제하므로 이중 수집되지 않음.
  ai-newsletters:
    type: gmail
    enabled: false
    schedule: "0 7 * * *"
    params:
      lookback_hours: 24
      include_queries:
        - "label:ai-news"
    labels: [ai-tech]
    extract_concepts: true
    track_personal: false

  # 수동 큐레이션 — <vault>/inbox/ 디렉토리에 .md/.txt/.json 파일을 떨어뜨리면
  # 정규 파이프라인(dedup, classify, concept extract)을 통과해 처리된 후
  # <vault>/inbox/archived/{date}/로 이동. content-hash dedup으로 같은 파일을
  # 두 번 넣어도 중복 등록되지 않음.
  manual-inbox:
    type: manual
    enabled: false      # 활성화하기 전에 inbox_dir이 실제 존재하는지 확인할 것
    schedule: "0 11 * * *"
    params:
      inbox_dir: ~/Documents/Obsidian Vault/inbox
      extensions: [md, txt, markdown, json]
      archive_after_ingest: true
    labels: [knowledge]
    extract_concepts: true

# ─── 중복 제거 ────────────────────────────────────────────
dedup:
  cascade: [event-id, content-hash, url, title]
  title_threshold: 0.85

# ─── 성과 추적 ───────────────────────────────────────────
performance:
  # Master switch for the work-log/performance subsystem (work-log generation +
  # weekly/monthly/quarterly/annual personal reviews). Off → none are produced, even
  # if sources set track_personal (which only flags events on their daily pages).
  enabled: true
  work_categories:
    - project-delivery
    - technical-leadership
    - team-contribution
    - innovation
    - operational-excellence
  uncategorized_label: "기타"
  # Per-source-ID override (highest priority). Use when same-type sources need
  # different categories (e.g., my-tasks → project-delivery, sre-tasks → operational-excellence).
  source_category_map: {}
  # Per-source-type fallback. Applied when source_category_map has no entry for this source.
  source_type_category_map:
    jira: project-delivery
    google-calendar: team-contribution

# ─── 종합 보고 ───────────────────────────────────────────
# weekly는 두 갈래: (1) include_sources의 소스 횡단 "주간 테마" 페이지(opt-in),
# (2) me/work-log 기반 개인 주간 요약. (2)와 monthly/quarterly/annual은 모두 work-log
# 기반 개인 성과 리뷰로 performance.enabled로 함께 켜고 끈다 — 지식/뉴스 소스는 무관.
synthesis:
  weekly:
    enabled: true
    schedule: "0 8 * * 1"           # Monday 08:00
    # 업무/소통 소스만 — 주간 테마 회고가 가치 있는 맥락. 뉴스/RSS 같은 지식 피드는
    # 넣지 않는다(개념 그래프에 이미 연속 누적되므로 주간 다이제스트가 중복).
    include_sources: [team-slack, slack-trends]
  monthly:
    enabled: true
    schedule: "0 8 1 * *"           # 1st of month 08:00
  quarterly:
    enabled: true
    schedule: "0 8 1 1,4,7,10 *"    # Quarter starts (Jan/Apr/Jul/Oct)
  annual:
    enabled: true
    schedule: "0 8 1 1 *"           # Jan 1st 08:00

# ─── 그래프 분석 ─────────────────────────────────────────
# Wikilink graph analysis (lore graph lint/cluster/suggest-links).
# Fully optional — omit the entire block to use defaults.
# graph:
#   scope:
#     dirs: [wiki]                   # vault-relative dirs to scan (default: [wiki])
#     exclude: []                    # glob patterns to skip (e.g., ["wiki/log.md"])
#     follow_links: false            # follow symlinks during walk
#   graph:
#     min_hub_degree: 5              # minimum total degree to flag as hub in lint
#     orphan_exclude: []             # page ids excluded from orphan reports
#   cluster:
#     resolution: 1.0                # Louvain resolution (higher = more, smaller communities)
#     max_iterations: 100            # max local-moving passes
#     min_community_size: 1          # drop communities smaller than this

# ─── LLM ──────────────────────────────────────────────────
# provider:
#   queue     — (default) emit JSONL tasks under <vault>/.lorekeeper/queue/.
#               A Claude Code skill (/lore-process) drains the queue using Claude
#               Code's native LLM session — no API key, no separate billing.
#               Workflow: `lore ingest` writes structural pages + queue; then run
#               `/lore-process` in Claude Code to fill summaries and concepts.
#   noop      — no LLM work; daily pages render without summary/concept content.
#               Useful for development, CI, or vault-only sources.
#   anthropic — direct Anthropic Messages API (requires ANTHROPIC_API_KEY).
#               Unattended-friendly: cron runs end-to-end without human/UI.
#               Choose this for headless servers or fully-autonomous overnight
#               pipelines where opening Claude Code is not an option.
llm:
  provider: queue
  model: claude-sonnet-4-6
  max_tokens: 4096
