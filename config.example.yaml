# Lorekeeper configuration
# Copy to config.yaml and customize for your environment.
# config.yaml is gitignored — safe for personal settings.
#
# Location (auto-discovered in this order):
#   1. --config / LORE_CONFIG
#   2. ./config.yaml                       (running from a repo checkout)
#   3. ~/.config/lorekeeper/config.yaml     (binary-only install)

# ─── Vault paths ──────────────────────────────────────────
vault:
  root: ~/Documents/Obsidian Vault
  timezone: system          # IANA name (e.g., "Asia/Seoul") or "system"
  locale: ko                # output language for added labels/headers: ko | en
                            # (source content — mail/Slack/Jira bodies — is never translated)
  dirs:
    daily: daily
    weekly: weekly
    monthly: monthly
    quarterly: quarterly
    annual: annual
    personal: me
    synthesis: synthesis
    wiki: wiki

# ─── Identity ─────────────────────────────────────────────
identity:
  name: "홍길동"
  email: "gildong.hong@company.com"
  # Slack user id — attributes your own channel posts to your work-log.
  # (Jira needs nothing here: ownership is derived from the authenticated account.)
  slack_id: "U0123456789"

# ─── Source definitions ───────────────────────────────────
# key = source ID = subdirectory name under daily/
# You can define several sources of the same type.
sources:

  # ── Intelligence (external trends) ──
  # google-drive: collect curated docs (briefings, etc.) from a shared Drive folder, file by file.
  drive-briefings:
    type: google-drive
    enabled: false
    schedule: "0 7 * * 1-5"
    params:
      folder: "AI-Briefing/briefings"
      file_pattern: "briefing-{date}.md"
    labels: [ai-industry]
    extract_concepts: true
    track_personal: false

  # ── Team (team observation) ──
  # The whole channel = team activity. Messages you authored are split into the work-log
  # automatically (track_personal + identity.slack_id). Most conversation is threaded, so
  # include_threads pulls reply context too.
  team-slack:
    type: slack-channel
    enabled: true
    schedule: "0 9 * * 1-5"
    params:
      # a single `channel`, or channels: ["C0123…", "#name"] (multiple, ids and names mixed)
      channels: ["#aix-team-digest"]
      lookback_hours: 24
      include_threads: true     # include thread replies as context
      exclude_bots: true        # drop bot/integration messages (default true)
      # watch_users: ["U0123…"] # (optional) only threads a given user authored or was mentioned in; empty = all
      # max_messages_per_channel: 500 # (optional) per-run history cap; raise for very busy channels
      # max_thread_messages: 200      # (optional) per-thread fetch cap (root message + replies)
    labels: [team-ops]
    extract_concepts: true
    track_personal: true

  # ── Personal (my activity — collected directly) ──
  my-tasks:
    type: jira
    enabled: true
    schedule: "0 9 * * 1-5"
    params:
      # Issues changed (= worked on) that day = a work-history snapshot. Due/start dates are
      # shown on the page as their values as-of that day, but the search key is `updated`
      # (so a later date change doesn't retroactively pollute past pages).
      jql: >
        assignee = currentUser()
        AND updated >= -1d
        ORDER BY updated DESC
      max_results: 50
    labels: [personal]
    extract_concepts: true
    track_personal: true

  my-schedule:
    type: google-calendar
    enabled: true
    schedule: "0 8 * * 1-5"
    params:
      calendar_id: primary
      lookback_hours: 24
      lookahead_hours: 24
      fetch_meeting_notes: true  # auto-extract meeting notes from Google Drive links
    labels: [personal]
    extract_concepts: true
    track_personal: true

  email-digest:
    type: gmail
    enabled: true
    schedule: "30 8 * * 1-5"
    params:
      lookback_hours: 24
      # Work mail only. `-label:ai-news` splits newsletters out of the work-log — the
      # ai-newsletters source below owns `label:ai-news`, so the two streams are mutually exclusive.
      include_queries:
        - "is:unread -category:promotions -category:social -category:updates -label:ai-news"
        - "from:@oliveyoung.co.kr is:unread -label:ai-news"
        - "from:@cj.net is:unread -label:ai-news"
      exclude:
        subjects: ["[Automated]", "noreply", "no-reply"]
        senders: ["notifications@", "mailer-daemon@", "calendar-notification@"]
        calendar_invites: true  # auto-exclude text/calendar attachments (invites/accepts/declines) (default true)
    # keyword → classification (source level, kept separate from params). Matched in order; first match wins.
    classify:
      - category: action_required
        keywords: ["action required", "please review", "검토 요청", "확인 부탁"]
      - category: decisions
        keywords: ["approved", "결재 완료", "승인"]
      - category: project_updates
        keywords: ["진행 상황", "업데이트", "progress"]
      - category: knowledge_sharing
        keywords: ["공유드립니다", "FYI", "참고"]
      - category: meeting_followup
        keywords: ["회의록", "action items", "후속"]
    labels: [personal, team-ops]
    extract_concepts: true
    track_personal: true

  # ── Trends (trend analysis) ──
  slack-trends:
    type: slack-search
    enabled: true
    schedule: "0 10 * * 1-5"
    params:
      queries:
        - channel: "#ai-general"
          keywords: [AI, LLM, GenAI, Claude, GPT]
        - channel: "#dev-talk"
          keywords: [MCP, RAG, vector, embedding]
      lookback_hours: 24
    labels: [ai-internal, strategy]
    extract_concepts: true
    track_personal: false

  # ── Knowledge (knowledge accumulation) ──
  # Accumulate external AI/tech news into wiki/concepts as a growing knowledge graph.
  # track_personal:false keeps the work-log/performance reviews clean. Leave classify empty
  # to avoid keyword misclassification; structuring is left to concept extraction +
  # `lore graph cluster`/`suggest-links`.

  # RSS/Atom feeds — poll vendor blogs and aggregators with no auth. One source handles many feeds.
  ai-news:
    type: rss
    enabled: false
    schedule: "0 7 * * *"
    params:
      lookback_hours: 24
      max_items_per_feed: 50
      feeds:
        # Vendors — most include the full body in RSS, so fetch_full_text isn't needed
        - { id: openai,            url: "https://openai.com/news/rss.xml" }
        - { id: deepmind,          url: "https://deepmind.google/blog/rss.xml" }
        - { id: google-ai,         url: "https://blog.google/technology/ai/rss/" }
        - { id: hf-blog,           url: "https://huggingface.co/blog/feed.xml" }
        # Cloud / applied / labs
        - { id: aws-ml,            url: "https://aws.amazon.com/blogs/machine-learning/feed/" }
        - { id: ms-research,       url: "https://www.microsoft.com/en-us/research/feed/" }
        - { id: bair,              url: "https://bair.berkeley.edu/blog/feed.xml" }
        # Practitioners / deep dives — feeds that ship only excerpts use fetch_full_text to pull the article
        - { id: sebastian-raschka, url: "https://magazine.sebastianraschka.com/feed", fetch_full_text: true }
        - { id: simon-willison,    url: "https://simonwillison.net/atom/everything/", fetch_full_text: true }
        # Aggregators / newsletters (RSS) — excerpt-only, full-text extraction recommended
        - { id: import-ai,         url: "https://importai.substack.com/feed", fetch_full_text: true }
        - { id: latent-space,      url: "https://www.latent.space/feed", fetch_full_text: true }
        - { id: the-gradient,      url: "https://thegradient.pub/rss/" }
        # Korean-language AI
        - { id: aitimes,           url: "https://www.aitimes.com/rss/allArticle.xml" }
        # Optional (high-volume research firehose — keep max_items_per_feed small if enabled):
        # - { id: arxiv-cs-lg,     url: "http://export.arxiv.org/rss/cs.LG" }
    labels: [ai-tech]
    extract_concepts: true
    focus: "AI/ML 모델·기법·아키텍처·인프라·도구·연구 등 AI 기술 주제."
    track_personal: false

  # Broad tech trends + Korean — aggregators (HN/GeekNews) + domestic engineering blogs.
  # Aggregators mix in non-technical noise (obituaries/politics/lifestyle), so the focus
  # filter (an LLM relevance gate) conceptualizes only technical topics — noise never piles up in the graph.
  tech-news:
    type: rss
    enabled: false
    schedule: "0 7 * * *"
    params:
      lookback_hours: 24
      max_items_per_feed: 25
      feeds:
        # Aggregators (English/Korean)
        - { id: hacker-news, url: "https://hnrss.org/frontpage?points=100" }
        - { id: geeknews,    url: "https://news.hada.io/rss/news" }
        # Domestic engineering blogs (in-depth)
        - { id: naver-d2,    url: "https://d2.naver.com/d2.atom" }
        - { id: kakao-tech,  url: "https://tech.kakao.com/feed/" }
        - { id: woowahan,    url: "https://techblog.woowahan.com/feed/" }
        - { id: toss-tech,   url: "https://toss.tech/rss.xml" }
        - { id: yozm-it,     url: "https://yozm.wishket.com/magazine/feed/" }
    labels: [tech]
    extract_concepts: true
    focus: "소프트웨어 엔지니어링·AI/ML·시스템·개발 도구·인프라 등 기술 주제만. 인물 부고·생활·정치·일반 시사 등 비기술 항목은 개념화하지 말 것."
    track_personal: false

  # Email newsletters (subscriptions with no RSS) — routed in Gmail by the `ai-news` label (set the filter once).
  # email-digest excludes the same mail via `-label:ai-news`, so they aren't ingested twice.
  ai-newsletters:
    type: gmail
    enabled: false
    schedule: "0 7 * * *"
    params:
      lookback_hours: 24
      include_queries:
        - "label:ai-news"
    labels: [ai-tech]
    extract_concepts: true
    track_personal: false

  # Manual curation — drop files into the <vault>/inbox/ directory and they become
  # individual wiki/documents/{slug}.md document pages (LLM summary + concept extraction included).
  # HTML is run through the readability crate to extract the body, then converted to Markdown.
  # content-hash dedup means the same file added twice is not registered twice.
  # After processing, files move to inbox/archived/{date}/ (post-commit, safe).
  manual-inbox:
    type: manual
    enabled: false
    schedule: "0 11 * * *"
    params:
      inbox_dir: ~/Documents/Obsidian Vault/inbox
      extensions: [md, txt, markdown, html, htm]
      archive_after_ingest: true  # auto-archive after processing (default true)
    labels: [knowledge]
    extract_concepts: true

# ─── Deduplication ────────────────────────────────────────
dedup:
  # Exact-match stages: same event-id / identical body / same canonical URL. Each proves
  # "same observation" exactly, so dedup is lossless — it never collapses two distinct
  # records (recurring "Weekly Sync" notes stay separate observations).
  cascade: [event-id, content-hash, url]
  # Extra query keys to strip during URL canonicalisation, beyond the built-in tracking set
  # (utm_*, fbclid, gclid, igshid, ref_src …). A trailing `*` is a prefix match (e.g. `pk_*`).
  # Never add a resource-identifying key — distinct pages would be merged into one.
  extra_tracking_params: []

# ─── Performance tracking ─────────────────────────────────
performance:
  # Master switch for the work-log/performance subsystem (work-log generation +
  # weekly/monthly/quarterly/annual personal reviews). Off → none are produced, even
  # if sources set track_personal (which only flags events on their daily pages).
  enabled: true
  work_categories:
    - project-delivery
    - technical-leadership
    - team-contribution
    - innovation
    - operational-excellence
  uncategorized_label: "기타"
  # Per-source-ID override (highest priority). Use when same-type sources need
  # different categories (e.g., my-tasks → project-delivery, sre-tasks → operational-excellence).
  source_category_map: {}
  # Per-source-type fallback. Applied when source_category_map has no entry for this source.
  source_type_category_map:
    jira: project-delivery
    google-calendar: team-contribution

# ─── Synthesis reports ────────────────────────────────────
# weekly has two tracks: (1) a cross-source "weekly themes" page over include_sources (opt-in),
# written to synthesis/weekly/; (2) a personal weekly summary from me/work-log (me/weekly/).
# (2) plus me/monthly/, me/quarterly/, me/annual/ are all work-log-based personal performance
# reviews, toggled together by performance.enabled — knowledge/news sources are irrelevant to them.
synthesis:
  weekly:
    enabled: true
    schedule: "0 8 * * 1"           # Monday 08:00
    # Work/communication sources only — the context where a weekly theme retro is valuable. Don't
    # include knowledge feeds like news/RSS (they already accumulate continuously in the concept
    # graph, so a weekly digest would be redundant).
    include_sources: [team-slack, slack-trends]
  monthly:
    enabled: true
    schedule: "0 8 1 * *"           # 1st of month 08:00
  quarterly:
    enabled: true
    schedule: "0 8 1 1,4,7,10 *"    # Quarter starts (Jan/Apr/Jul/Oct)
  annual:
    enabled: true
    schedule: "0 8 1 1 *"           # Jan 1st 08:00

# ─── Concept categorization ───────────────────────────────
# Concept categorization for wiki/concepts/ pages.
# Categories give the LLM a fixed vocabulary when assigning topics.
# Omit the entire block to skip categorization.
concepts:
  categories:
    - id: ai-ml
      label: "AI/ML"
    - id: infrastructure
      label: "인프라"
    - id: software-engineering
      label: "소프트웨어 엔지니어링"
    - id: product-service
      label: "제품/서비스"
    - id: organization
      label: "조직/이벤트"
  index_split_threshold: 100  # when concepts exceed this count, auto-split into per-category sub-pages

# ─── Graph analysis ───────────────────────────────────────
# Wikilink graph analysis (lore graph lint/cluster/suggest-links).
# Fully optional — omit the entire block to use defaults.
# graph:
#   scope:
#     dirs: [wiki]                   # vault-relative dirs to scan (default: vault.dirs.wiki)
#     exclude: []                    # glob patterns to skip (e.g., ["wiki/log.md"])
#     follow_links: false            # follow symlinks during walk
#   metrics:
#     min_hub_degree: 5              # minimum total degree to flag as hub in lint
#     orphan_exclude: []             # page ids excluded from orphan reports
#     concept_near_duplicate_threshold: 0.6  # slug similarity to flag as near-dup merge candidate
#   cluster:
#     resolution: 1.0                # Louvain resolution (higher = more, smaller communities)
#     max_iterations: 100            # max local-moving passes per aggregation level
#     min_community_size: 1          # drop communities smaller than this
#     suggest_min_shared_neighbors: 2  # suggest-links floor: min shared neighbors per pair (cuts co-citation noise)

# ─── Maintenance ──────────────────────────────────────────
# Retention horizon for `lore maintenance` pruning (ingest log, dedup cache,
# drained queue files). Fully optional — omit the block to use the default.
# maintenance:
#   retention_days: 90               # must exceed the longest silent gap between
#                                    # re-arrivals of the same item, or a slow-recurring
#                                    # source re-emits as novel after the gap

# ─── LLM ──────────────────────────────────────────────────
# provider:
#   queue     — (default) emit JSONL tasks under <vault>/.lorekeeper/queue/.
#               A Claude Code skill (/lore-process) drains the queue using Claude
#               Code's native LLM session — no API key, no separate billing.
#               Workflow: `lore ingest` writes structural pages + queue; then run
#               `/lore-process` in Claude Code to fill summaries and concepts.
#               For unattended cron: `lore ingest && claude -p "/lore-process"`
#   noop      — no LLM work; daily pages render without summary/concept content.
#               Useful for development, CI, or vault-only sources.
llm:
  provider: queue
