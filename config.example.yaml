# wiki-ingest configuration
# Copy to config.yaml and customize for your environment.
# config.yaml is gitignored — safe for personal settings.

# ─── Vault 경로 ───────────────────────────────────────────
vault:
  root: ~/Documents/Obsidian Vault
  timezone: system          # IANA name (e.g., "Asia/Seoul") or "system"
  dirs:
    daily: daily
    weekly: weekly
    monthly: monthly
    quarterly: quarterly
    annually: annually
    personal: me
    wiki: wiki

# ─── 사용자 식별 ──────────────────────────────────────────
identity:
  name: "홍길동"
  email: "gildong.hong@company.com"
  slack_id: "U0123456789"
  jira_id: "gildong.hong"

# ─── 소스 정의 ────────────────────────────────────────────
# 키 = 소스 ID = daily/ 하위 디렉토리명
# 같은 type으로 여러 소스를 정의할 수 있습니다.
sources:

  # ── Intelligence (외부 동향) ──
  ai-news:
    type: google-drive
    enabled: true
    schedule: "0 7 * * 1-5"
    params:
      folder: "AI-Briefing/briefings"
      file_pattern: "briefing-{date}.md"
    labels: [ai-industry]
    extract_concepts: true
    track_personal: false

  # ── Team (팀 관찰) ──
  team-slack:
    type: slack-channel
    enabled: true
    schedule: "0 9 * * 1-5"
    params:
      channel: "#aix-team-digest"
      lookback_hours: 24
    labels: [team-ops]
    extract_concepts: true
    track_personal: false

  # ── Personal (내 활동 — 직접 수집) ──
  my-tasks:
    type: jira
    enabled: true
    schedule: "0 9 * * 1-5"
    params:
      jql: >
        assignee = currentUser()
        AND updated >= -1d
        ORDER BY updated DESC
      fields: [summary, status, priority, labels, updated]
      max_results: 50
    labels: [personal]
    extract_concepts: false
    track_personal: true

  my-schedule:
    type: google-calendar
    enabled: true
    schedule: "0 8 * * 1-5"
    params:
      calendar_id: primary
      lookback_hours: 24
      lookahead_hours: 24
    labels: [personal]
    extract_concepts: false
    track_personal: true

  email-digest:
    type: gmail
    enabled: true
    schedule: "30 8 * * 1-5"
    params:
      lookback_hours: 24
      include_queries:
        - "is:unread -category:promotions -category:social -category:updates"
        - "from:@oliveyoung.co.kr is:unread"
        - "from:@cj.net is:unread"
      exclude:
        subjects: ["[Automated]", "noreply", "no-reply"]
        senders: ["notifications@", "mailer-daemon@", "calendar-notification@"]
      classify:
        action_required: ["action required", "please review", "검토 요청", "확인 부탁"]
        decisions: ["approved", "결재 완료", "승인"]
        project_updates: ["진행 상황", "업데이트", "progress"]
        knowledge_sharing: ["공유드립니다", "FYI", "참고"]
        meeting_followup: ["회의록", "action items", "후속"]
    labels: [personal, team-ops]
    extract_concepts: true
    track_personal: true

  # ── Trends (트렌드 분석) ──
  slack-trends:
    type: slack-search
    enabled: true
    schedule: "0 10 * * 1-5"
    params:
      queries:
        - channel: "#ai-general"
          keywords: [AI, LLM, GenAI, Claude, GPT]
        - channel: "#dev-talk"
          keywords: [MCP, RAG, vector, embedding]
      lookback_hours: 24
    labels: [ai-internal, strategy]
    extract_concepts: true
    track_personal: false

# ─── 중복 제거 ────────────────────────────────────────────
dedup:
  cascade: [event-id, url, title]
  title_threshold: 0.85

# ─── 라벨 ────────────────────────────────────────────────
labels:
  categories:
    - ai-industry
    - ai-internal
    - team-ops
    - strategy
    - personal
    - learning

# ─── 성과 추적 ───────────────────────────────────────────
performance:
  enabled: true
  work_categories:
    - project-delivery
    - technical-leadership
    - team-contribution
    - innovation
    - operational-excellence
  uncategorized_label: "기타"
  # Per-source-ID override (highest priority). Use when same-type sources need
  # different categories (e.g., my-tasks → project-delivery, sre-tasks → operational-excellence).
  source_category_map: {}
  # Per-source-type fallback. Applied when source_category_map has no entry for this source.
  source_type_category_map:
    jira: project-delivery
    google-calendar: team-contribution
  summaries:
    weekly: true
    monthly: true
    quarterly: true
    annual: true

# ─── 개념 추출 ───────────────────────────────────────────
concepts:
  min_mentions: 2
  merge_threshold: 0.8

# ─── 종합 보고 ───────────────────────────────────────────
synthesis:
  weekly:
    enabled: true
    schedule: "0 8 * * 1"           # Monday 08:00
    include_sources: [ai-news, team-slack, slack-trends]
  monthly:
    enabled: true
    schedule: "0 8 1 * *"           # 1st of month 08:00
  quarterly:
    enabled: true
    schedule: "0 8 1 1,4,7,10 *"    # Quarter starts (Jan/Apr/Jul/Oct)
  annual:
    enabled: true
    schedule: "0 8 1 1 *"           # Jan 1st 08:00

# ─── LLM ──────────────────────────────────────────────────
llm:
  provider: anthropic
  model: claude-sonnet-4-6
  max_tokens: 4096
